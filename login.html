<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Login</title>
     <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <!-- css-->
    <link rel="stylesheet" href="css/login.css">
  </head>

  <body> 
       <div class="logo-top">
        <img src="images/NameDanna.jpeg" class="logo">  
        </div>  
        
        <div class="background-page">

         <div class="login-content">
             <h1 class="title-login">DANNA DANNA</h1>

          <form id="loginForm" class="form-grid">

             <div>
              <label class="text-form">CORREO ELECTRONICO</label>
              <input type="email" name="correo" placeholder="example@gmail.com" required />
             </div>

             <div>
             <label class="text-form">CONTRASEÑA </label>
             <input type="password" name="password" placeholder="***********" required />
             </div>

            <button type="submit" class="btn-full btn-login">INICIAR SESION</button>
            <p class="social-text">o utilizar otro perfil social</p>

            <div class="social-buttons">
              <button class="btn-social twitter">
                <i class="fab fa-twitter"></i> Twitter</button>
              <button class="btn-social facebook">
                <i class="fab fa-facebook"></i> Facebook </button>
            </div>

            <div class="login-links">
              <a href="createUser.html" class="register">Registrate</a>
              <a href="#" class="forgot">Olvido su contraseña?</a>
            </div>

         </form>

    <script src="js/login.js"></script>

       </div>
      </div>
  </body>
</html>
