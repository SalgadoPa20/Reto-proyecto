<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Pago</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <!-- css-->
        <link rel="stylesheet" href="css/pago.css">
</head>

<body>
        <div class="logo-top">
        <img src="images/NameDanna.jpeg" class="logo">
       </div> 

    <div class="background-page">

    <div class="pago-content">
        <h1 class="title-pago">DATOS DE PAGO</h1>

        <form id="payment-form" class="form-grid">
            <div>
                <label class="text-form">NUMERO DE TARJETA</label>
                <input type="text" name="card-number" placeholder="1234 5678 9012 3456" required>
            </div>
            <div>
                <label class="text-form">FECHA DE EXPIRACION (MM/AA)</label>
                <input type="text" name="expiry-date" placeholder="MM/AA" required>
            </div>
            <div>
                <label class="text-form">CODIGO DE SEGURIDAD</label>
                <input type="text" name="cvc" placeholder="123" required>
            </div>
            <div>
                <label class="text-form">NOMBRE DEL TITULAR</label>
                <input type="text" name="card-name" placeholder="Paula Andrea Salgado Vasco" required>
            </div>
            <div>
                <label class="text-form">NUMERO DE DOCUMENTO</label>
                <input type="text" name="id-number" placeholder="1113693341" required>
            </div>
            <div>
                <label class="text-form">CUOTAS</label>
                <input type="text" name="payment-number" placeholder="2" required>
            </div>
            <button type="submit" class="btn-full btn-pago">PAGAR AHORA</button>
        </form>
        </div>
    </div>
</body>
</html>
