<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=de<vice-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <!-- css-->
    <link rel="stylesheet" href="css\createUser.css">
  </head>

  <body>
        <div class="logo-top">
        <img src="images\NameDanna.jpeg" class="logo">  
        </div>  
        
    <div class="background-page">

   <div class="registro-content">
         <h1 class="title-registro">REGISTRO DE USUARIO</h1>

    <form id="createUserForm" class="form-grid"> 

    <div>
    <label class="text-form">NOMBRE COMPLETO</label>
    <input type="text" name="nombre_completo" placeholder="Paula Andrea Salgado Vasco" required />
    </div>

   <div>
    <label class="text-form">CORREO ELECTRONICO¨</label>
    <input type="email" name="correo" placeholder="paula.salgado268@gmail.com" required />
  </div>

  <div>
    <label class="text-form">TIPO DE DOCUMENTO</label>
    <select name="tipo_documento" required>
      <option value="">Seleccione</option>
      <option value="CC">Cédula</option>
      <option value="PAS">Pasaporte</option>
      <option value="OTRO">Otro</option>
    </select>
  </div>

  <div>
    <label class="text-form">NUMERO DE DOCUMENTO</label>
    <input type="text" name="numero_documento" placeholder="1113693341" required />
  </div>

  <div>
    <label class="text-form">TELEFONO</label>
    <input type="text" name="telefono" placeholder="3188410749" required />
  </div>

  <div>
    <label class="text-form">DIRECCION</label>
    <input type="text" name="direccion" placeholder="Calle 35 # 2 - 49" required />
  </div>

  <div>
    <label class="text-form">USUARIO</label>
    <input type="text" name="usuario" placeholder="Andrea17" required />
  </div>

  <div>
    <label class="text-form">CONTRASEÑA</label>
    <input type="password" name="contrasena" placeholder="*************" required />
  </div>

  <button type="submit" class="btn-full btn-create">REGISTRATE</button>
</form>
   
    <script src="js/createUser.js"></script>
    </div>
    </div>
  </body>
</html>
